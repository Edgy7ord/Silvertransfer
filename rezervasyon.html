<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rezervasyon</title>
    <link rel="stylesheet" href="style.css"> <!-- CSS dosyasını bağlama -->
</head>
<body>
    <header>
        <h1>Rezervasyon</h1>
        <nav>
            <a href="Startseite.html">Ana Sayfa</a>
            <a href="kontakt.html">İletişim</a>
            <a href="Fahrzeuge.html">Araçlarımız</a>
            <a href="Rezervasyon.html">Rezervasyon</a>
            <a href="Hakkımızda.html">Hakkımızda</a>
            <a href="Hizmetlerimiz.html">Hizmetlerimiz</a>
        </nav>
    </header>
    <main>
        <section class="reservation-form">
            <h2>Şimdi Rezervasyon Yapın</h2>
            <form action="submit_reservation.php" method="POST">
                <label for="name">Adınız:</label>
                <input type="text" id="name" name="name" placeholder="Adınızı Girin" required>

                <label for="date">Tarih:</label>
                <input type="date" id="date" name="date" required>

                <label for="time">Saat:</label>
                <input type="time" id="time" name="time" required>

                <label for="guests">Kişi Sayısı:</label>
                <input type="number" id="guests" name="guests" min="1" max="20" placeholder="1" required>

                <label for="message">Mesaj (isteğe bağlı):</label>
                <textarea id="message" name="message" rows="4" placeholder="Özel istekler veya notlar"></textarea>

                <button type="submit">Rezervasyon Yap</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 Şirketiniz</p>
    </footer>
</body>
</html>
